# Konfigurace pro lokalni beh (Windows bez prav spravce i jinde).
#
# address = "localhost" je tu to podstatne: ve vychozim stavu Streamlit nasloucha
# na vsech rozhranich a Windows na to vyhodi dialog firewallu, jehoz schvaleni
# vyzaduje prava spravce. Vazba na loopback dialog vubec nevyvola.
[server]
address = "localhost"
port = 8501

# Bez vyzvy k zadani e-mailu pri prvnim spusteni - aplikace se pousti
# dvojklikem a cekani na vstup v konzoli vypada jako zaseknuty start.
showEmailPrompt = false

# Bez telemetrie - v podnikove siti by chodila pres proxy a nema tu co delat.
[browser]
gatherUsageStats = false
